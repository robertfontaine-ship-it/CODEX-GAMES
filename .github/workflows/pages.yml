name: Deploy WRS Quest + Marketing Concept Library

on:
  push:
    branches:
      - main
    paths-ignore:
      - DEPLOYMENT_STATUS.md
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wrs-quest-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run game-rule tests
        run: npm test

      - name: Build production app
        run: npm run build

      - name: Add Marketing Concept Library to Pages artifact
        run: |
          mkdir -p dist/concept-library dist/marketing
          cp -R concept-library-v2/. dist/concept-library/
          cp -R concept-library-v2/. dist/marketing/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout main for deployment status
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish verified site URLs
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          cat > DEPLOYMENT_STATUS.md <<EOF
          # Classroom Sites Deployment

          Status: LIVE

          WRS Quest: ${PAGE_URL}

          Marketing Concept Library: ${PAGE_URL}marketing/

          Legacy Concept Library URL: ${PAGE_URL}concept-library/

          Deployed commit: ${GITHUB_SHA}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          if git diff --cached --quiet; then
            echo "Deployment status is already current."
          else
            git commit -m "Record verified classroom site URLs"
            git push origin HEAD:main
          fi
